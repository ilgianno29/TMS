function settaParametri()
{
	casellexLarghezza = window.prompt("Inserite il numero di caselle per larghezza ("

}

function verificaCasellexLarghezza()
{
	if (isNaN(casellexLarghezza))
	{
		alert("Ho detto un numero! Inserire di nuovo il numero di caselle per altezza");
		settaParametri();
	}
	else if (casellexLarghezza > maxCaselle)
	{
		alert("Sono troppe! Inserire di nuovo il numero di caselle per larghezza");
		settaParametri();
	}
	else if (casellexLarghezza < minCaselle)
	{
		alert("Sono poche! Inserire di nuovo il numero di caselle per larghezza");
		settaParametri();
	}
	else accettaCasellexLarghezza();
}

{

function nuovaPartita() 
{
	// Resetta gli array di stato. 
	// mine memorizza la posizione di tutte le mine. 
	// icona tiene traccia dell'immagine mostrata in ogni casella della griglia
	for(var y = 0; y < casellexAltezza; y++)
	{
		mine[y] = [];
		icona[y] = [];
		for (var x = 0; x < casellexLarghezza; x++)
		{
			mine[y][x] = false; 
			icona[y][x] = 0; 
		}
	}
	// Posiziona le mine, verificando che vadano a finire in punti diversi tra loro
	for(var m = 0; m < maxmine; m++) 
	{
		var x,y;
		do 
		{
			x = Math.floor(Math.random() * casellexLarghezza);
			y = Math.floor(Math.random() * casellexAltezza);
		} while(mine[y][x]);
		mine[y][x] = true;
	}
	// inizializza le variabili del gioco
	caselleCoperte= casellexAltezza * casellexLarghezza;
	bandierineRimaste = maxmine;
	tempo = 0;
	giocoIniziato = true;
	cliccato = false
	premutoCtrl = false;
	// insert the grid into the document
	creaGriglia();
	
	// Set up dei gestori dell'evento "tasto premuto"
	window.document.onkeydown = keyDown;
	window.document.onkeyup = keyUp;
	// setta orologio
	setInterval("scandisci()", 1000);
}

function keyDown() 
{   
	premutoCtrl = window.event.ctrlKey;
	aggiornaDisplay();
}

function keyUp() 
{  
	premutoCtrl = false;
	aggiornaDisplay();
}

// scandisce il tempo passato aggiornando lo stato dei display di tempo e bandierine
function scandisci() 
{
	if (giocoIniziato) 
	{
		//il tempo si comincia a contare dopo il primo click sulla griglia
		if (cliccato) 
		{
			tempo++;
			aggiornaDisplay();
   		}
   		else //mostra il numero totale di bandierine a disposizione
  		{
  			aggiornaDisplay();
  		}
  	}
  	
}

// Aggiorna lo stato dei display di tempo e bandierine cifra per cifra
function aggiornaDisplay() 
{
	document.images.elapse3.src=num[tempo-(Math.floor(tempo/10))*10].src;
	document.images.elapse2.src=num[Math.floor((tempo-(Math.floor(tempo/100))*100)/10)].src;

	document.images.flag2.src=num[Math.floor((bandierineRimaste-(Math.floor(bandierineRimaste/100))*100)/10)].src;
	document.images.flag1.src=num[Math.floor(bandierineRimaste/100)].src;
}

// Funzione che calcola il numero di mine adiacenti a una data casella pos: (riga y, col x)
function mineIntorno(y,x) 
{
	var conta = 0;
	//controllo in alto a sx
	if (y > 0 && x > 0 && mine[y-1][x-1]) 
		conta++;
	//controllo in alto sopra
	if (y > 0 && mine[y-1][x]) 
		conta ++;
	//controllo in alto a dx
	if (y > 0 && x < casellexLarghezza-1 && mine[y-1][x+1]) 
		conta++;
	//controllo a sx
	if (x > 0 && mine[y][x-1]) 
		conta++;
	//controllo a dx
	if (x < casellexLarghezza-1 && mine[y][x+1]) 
		conta++;
	//controllo in basso a sx
	if (y < casellexAltezza-1 && x > 0 && mine[y+1][x-1]) 
		conta++;
	//controllo in basso sotto
	if (y < casellexAltezza-1 && mine[y+1][x]) 
		conta++;
	//controllo in basso a dx
	if (y < casellexAltezza-1 && x < casellexLarghezza-1 && mine[y+1][x+1]) 
		conta++;
	return conta;
}

// Funzione ricorsiva per "l'apertura" della griglia quando 
// l'utente clicca su una casella senza mine intorno
function scopri(y,x) 
{
	if (y >= 0 && y < casellexAltezza && x >=0 && x < casellexLarghezza) 
	{
		if (icona[y][x] != 3) 
		{
			//si contano le mine adiacenti alla casella e si sostituisce l'immagine corrispondente
			var c = mineIntorno(y,x);
			icona[y][x] = 3;//casella dove non ci si deve fare più nulla
			caselleCoperte--;
			document.images["grd" + y + "_" + x].src = dir + "sq" + c + ".gif";
			
			if (caselleCoperte == 0)//vittoria
			{
				document.images.condition.src = dir + "btncool.gif";//faccina vittoriosa
				giocoIniziato = false;//ferma l'orologio
      		}

			//se non ha mine intorno, per tutte le caselle adiacenti si fanno 
			//ricorsivamente controlli analoghi
			if (c == 0) 
			{
				scopri(y-1,x-1);
				scopri(y-1,x);
				scopri(y-1,x+1);
				scopri(y,x-1);
				scopri(y,x+1);
				scopri(y+1,x-1);
				scopri(y+1,x);
				scopri(y+1,x+1);
         	}
       }
   }
}

	for(y = 0; y < casellexAltezza; ++y) 
	{
		for(x = 0; x < casellexLarghezza; ++x) 
		{
			if (mine[y][x])//se c'è la mina
			{
				//faccio vedere le mine al posto delle caselle coperte e di quelle con ?
				if (icona[y][x] != 1) 
				{
					document.images["grd"+y+"_"+x].src = dir + "mine.gif";
   				}
			}
			else if (icona[y][x] == 1) //non c'è la mina e era flaggato (avevo esagerato con le bandierine)
			{
				document.images["grd"+y+"_"+x].src = dir + "nomine.gif";
      		}
   		}
	}
	document.images["grd" + i + "_" + j].src = dir + "minered.gif";

	document.images.condition.src = dir + "btndead.gif";
	giocoIniziato = false;
	cliccato = false;
}

// questo gestore dell'evento click è associato a ogni casella (v. creaGriglia)
function clickCasella(y, x) 
{
	if (giocoIniziato) 
	{
		cliccato = true;
		if (premutoCtrl) //è true se ho premuto ctrl key
		{
			if (icona[y][x] < 3) //0: normale, 1: bandierina, 2: punto interrogativo
			{	
				var s = icona[y][x];
				var change = true;
				
				//s==1: c'è la bandierina, la tolgo e incremento il numero di bandierine rimaste	
				// e di caselle rimaste da scoprire			
				if (s == 1)
				{
					bandierineRimaste++;
					caselleCoperte++;
				}
				
				//se non ci sono rimaste bandierine e sono su una casella coperta lascio tutto come è
				if (bandierineRimaste == 0 && s == 0) 
				{
					change = false;
				}
				else 
				{
					if (s == 2) //punto interrogativo diventa casella coperta 'normale'
						s = 0;
					else 
						s++;//0->1 (normale->bandierina) 1->2 (bandierina->punto interrogativo)
					
					//se sono passata da normale a bandierina decremento le bandierine e le caselle rimaste	
					if (s == 1) 
					{
						bandierineRimaste--;
						caselleCoperte--;
   					}
				}
				if (change)//cambio l'immagine relativa alla casella
				{
					icona[y][x] = s;
					document.images["grd"+y+"_"+x].src = dir + "sqt"+s+".gif";
					aggiornaDisplay();
				}
				if (caselleCoperte == 0)//vittoria
				{
					document.images.condition.src = dir + "btncool.gif";//faccina vittoriosa
					giocoIniziato = false;//ferma l'orologio
      			}
   			}
		}
		// ho cliccato pensando che non ci fosse una mina: controllo!
		else if (icona[y][x] != 1) 
		{
			//sono finita su una mina: addio!
			if (mine[y][x]) 
			{
				document.images["grd"+y+"_"+x].src = dir + "minered.gif";//inutile qui, sovrascritta da addio()
				addio(y,x);
			}
			else //l'ho scampata, vediamo che c'è intorno
			{
				scopri(y,x);
         	}
      }
   }
}

function vai()
{
	settaParametri();		
	nuovaPartita();
}
